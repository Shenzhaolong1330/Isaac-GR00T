# Shared PhysBrain16/data/trainer settings. Select a concrete train_*.yaml to run.
mode: train
model:
  model_name: checkpoints/PhysBrain1.5-2B-gr00t
  select_layer: 16
  action_horizon: 40
  tune_llm: true
  tune_visual: true
  tune_projector: true
  tune_diffusion_model: true
  load_bf16: false
  use_relative_action: false
  use_percentiles: true
  state_dropout_prob: 0.0
  image_crop_size: null
  image_target_size: null
  shortest_image_edge: 256
  crop_fraction: 1.0
  color_jitter_params:
    brightness: 0.0
    contrast: 0.0
    saturation: 0.0
    hue: 0.0
  use_flash_attention: false
  letter_box_transform: true
data:
  seed: 42
  override_pretraining_statistics: true
  datasets:
  - dataset_paths:
    - /user/users/szl/dataset/dual_franka/gr00t_ee14_v21/train
    val_dataset_path: /user/users/szl/dataset/dual_franka/gr00t_ee14_v21/validation
    embodiment_tag: new_embodiment
    mix_ratio: 1.0
  allow_padding: false
  multiprocessing_context: spawn
training:
  start_from_checkpoint: null
  num_gpus: 4
  global_batch_size: 64
  gradient_accumulation_steps: 1
  save_total_limit: 2
  save_only_model: false
  save_vl_model: true
  learning_rate: 0.0001
  weight_decay: 0.01
  gradient_checkpointing: false
  dataloader_num_workers: 2
  use_wandb: true
  wandb_project: dual-franka-gr00t-n17
  transformers_local_files_only: true
  transformers_trust_remote_code: false
  eval_strategy: 'no'
  eval_steps: 1000
  eval_batch_size: 2
  logging_steps: 10
  max_grad_norm: 1.0
  max_retries: 0
deployment:
  validation_samples: 32
  wandb_entity: shenzhaolong1330-beihang-university
  wandb_timeout_seconds: 90
  wandb_check_attempts: 3
  wandb_init_timeout_seconds: 180
