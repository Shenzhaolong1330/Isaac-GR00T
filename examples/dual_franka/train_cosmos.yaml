mode: train
model:
  model_name: nvidia/Cosmos-Reason2-2B
  select_layer: 16
  action_horizon: 40
  tune_llm: true
  tune_visual: true
  tune_projector: true
  tune_diffusion_model: true
  load_bf16: false
  use_relative_action: false
  use_percentiles: true
  state_dropout_prob: 0.0
  image_crop_size: null
  image_target_size: null
  shortest_image_edge: 256
  crop_fraction: 1.0
  color_jitter_params: {brightness: 0.0, contrast: 0.0, saturation: 0.0, hue: 0.0}
data:
  seed: 42
  override_pretraining_statistics: true
  datasets:
    - dataset_paths: [datasets/dual_franka_ee14_v21_train]
      val_dataset_path: datasets/dual_franka_ee14_v21_val
      embodiment_tag: new_embodiment
      mix_ratio: 1.0
training:
  start_from_checkpoint: checkpoints/GR00T-N1.7-3B
  output_dir: outputs/dual_franka_cosmos
  num_gpus: 4
  global_batch_size: 64
  gradient_accumulation_steps: 1
  max_steps: 100000
  save_steps: 10000
  save_total_limit: 10
  save_only_model: false
  save_vl_model: true
  learning_rate: 0.0001
  warmup_ratio: 0.01
  weight_decay: 0.01
  gradient_checkpointing: false
  dataloader_num_workers: 2
  use_wandb: true
  wandb_project: dual-franka-gr00t-n17
  transformers_local_files_only: true
  transformers_trust_remote_code: false
  eval_strategy: steps
  eval_steps: 1000
  eval_batch_size: 2
